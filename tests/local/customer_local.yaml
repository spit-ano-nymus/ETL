# =============================================================================
# Local test of the one-click pipeline with a small `customer` table.
# Everything runs from the terminal — pgAdmin is not needed.
#
# Run from the project root (the folder that has main.py), after setting the
# password once per terminal window:
#   PowerShell:  $env:PG_PASSWORD = "your-postgres-password"
#
#   .venv\Scripts\python main.py --pipeline tests/local/customer_local.yaml --sql tests/local/setup_customer.sql
#       (the first command also installs sql/ into the database)
#   .venv\Scripts\python main.py --pipeline tests/local/customer_local.yaml --file tests/local/customer_jan.csv
#   .venv\Scripts\python main.py --pipeline tests/local/customer_local.yaml --file tests/local/customer_mar.csv
#   .venv\Scripts\python main.py --pipeline tests/local/customer_local.yaml --file tests/local/customer_jun.csv
#   .venv\Scripts\python main.py --pipeline tests/local/customer_local.yaml --sql tests/local/check_customer.sql
#
# check_customer.sql prints the expected numbers next to each query.
# To start over:  --sql tests/local/reset_customer.sql
# =============================================================================
pipeline:
  table_key: customer

source:
  type: file
  path: tests/local/customer_jan.csv
  separator: ","
  encoding: utf-8-sig

postgres:
  host: localhost
  port: 5432
  database: etl_test
  user: postgres
  password_env: PG_PASSWORD       # set it in the terminal before running (see the steps)
