# =============================================================================
# Practice table — payments. Nothing to change here except the password
# variable if yours differs: this file only says where to read and how to
# connect. Everything about the table itself goes in payments_setup.sql.
#
#   python main.py --pipeline tests/local/payments_local.yaml --sql tests/local/payments_setup.sql
#   python main.py --pipeline tests/local/payments_local.yaml --file tests/local/payments_jan.csv
#   python main.py --pipeline tests/local/payments_local.yaml --file tests/local/payments_feb.csv
#   python main.py --pipeline tests/local/payments_local.yaml --sql tests/local/check_payments.sql
# =============================================================================

pipeline:
  table_key: payments

source:
  type: file
  path: tests/local/payments_jan.csv
  separator: ","
  encoding: utf-8-sig

postgres:
  host: localhost
  port: 5432
  database: etl_test
  user: postgres
  password_env: PG_PASSWORD
